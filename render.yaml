databases:
  - name: emagne-db
    databaseName: emagne
    user: emagne_user

services:
  - type: web
    name: emagne
    env: go
    buildCommand: go build -o app cmd/main.go
    startCommand: ./app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emagne-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
